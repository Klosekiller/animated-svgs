<svg xmlns="http://www.w3.org/2000/svg" id="Layer_2" viewBox="0 0 234.44 81.25" class="svg-image friends-logo"><style>
  /* Plays once on load: the book opens out from its spine (pages first, then the
     covers, with a little overshoot), FRIENDS rises up letter by letter, then the two
     small lines sweep in from left to right. */
  .friends-logo .page-l, .friends-logo .page-r,
  .friends-logo .cover-l, .friends-logo .cover-r {
    transform-box: view-box;
    transform-origin: 33.49px 40.62px;
  }
  .friends-logo .page-l, .friends-logo .page-r { animation: fr-open 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) 0.1s both; }
  .friends-logo .cover-l, .friends-logo .cover-r { animation: fr-open 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) 0.35s both; }

  .friends-logo .big, .friends-logo .small { transform-box: fill-box; transform-origin: 50% 100%; }
  .friends-logo .big { animation: fr-rise 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
  .friends-logo .small { animation: fr-sweep 0.35s ease-out both; }

  @keyframes fr-open {
    0%   { transform: scaleX(0); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: scaleX(1); opacity: 1; }
  }
  @keyframes fr-rise {
    0%   { transform: translateY(14px) scaleY(0.4); opacity: 0; }
    100% { transform: translateY(0) scaleY(1); opacity: 1; }
  }
  @keyframes fr-sweep {
    0%   { transform: translateX(-6px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .friends-logo * { animation: none !important; }
  }
