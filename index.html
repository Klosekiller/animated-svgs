<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap">
    <title>Logo Mark Preview</title>
    <!-- Preview page only. The marks use <object> rather than <img> so the svg:hover animation can fire. -->
    <style>
        body {
            margin: 0;
            padding: 3rem 1rem;
            font-family: "Jost", sans-serif;
            color: #002852;
            background-color: #f0f0f0;
        }

        h1,
        h2 {
            margin: 0 0 1rem;
            text-align: center;
        }

        p {
            text-align: center;
        }

        section {
            max-width: 60rem;
            margin: 0 auto 3rem;
        }

        .stage {
            display: grid;
            position: relative;
            place-items: center;
            padding: 3rem 2rem;
        }

        .stage--dark {
            background-color: #002852;
        }

        .stage--light {
            background-color: #ffffff;
        }

        .stage object {
            display: block;
            width: 232px;
            height: 228px;
        }

        .stage .ubs {
            display: block;
            width: 100%;
            max-width: 273px;
            height: auto;
        }

        button {
            display: block;
            margin: 1rem auto 0;
            padding: 0.6rem 1.5rem;
            font: inherit;
            font-weight: 700;
            color: #ffffff;
            background-color: #002852;
            border: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Logo Mark Preview</h1>
    <p>Use each Replay button to play an animation. Hover over either logo mark to play its page turn, too.</p>

    <section>
        <h2>Original (white)</h2>
        <div class="stage stage--dark">
            <object id="logo-white" type="image/svg+xml" data="logo-mark-animated.svg" aria-label="Logo mark, white"></object>
        </div>
        <button type="button" id="replay-logo-white">Replay</button>
    </section>

    <section>
        <h2>Color version</h2>
        <div class="stage stage--light">
            <object id="logo-color" type="image/svg+xml" data="logo-mark-animated-color.svg" aria-label="Logo mark, color"></object>
        </div>
        <button type="button" id="replay-logo-color">Replay</button>
    </section>

    <section>
        <h2>Used Book Sales (plays on load)</h2>
        <div class="stage stage--light">
            <img id="ubs" class="ubs" src="used-book-sales-animated.svg" alt="Used Book Sales" width="273" height="322">
        </div>
        <button type="button" id="replay-ubs">Replay</button>
    </section>

    <section>
        <h2>Next Five Faves (plays on load)</h2>
        <div class="stage stage--light">
            <img id="nff" class="ubs" src="next-five-faves-animated.svg" alt="Next Five Faves" width="273" height="273">
        </div>
        <button type="button" id="replay-nff">Replay</button>
    </section>

    <section>
        <h2>Friends logo (plays on load)</h2>
        <div class="stage stage--light">
            <img id="friends" src="friends-logo-animated.svg" alt="Friends of the Greenville County Library System" width="469" height="163" style="display:block;width:100%;max-width:469px;height:auto">
        </div>
        <button type="button" id="replay-friends">Replay</button>
    </section>

    <script>
        // Matches the 3s animation-duration in the hover logo marks.
        const LOGO_ANIMATION_MS = 3000;

        // Replays a hover logo mark by loading a fresh copy of the file with ?play, which
        // makes the SVG start its animation. Reaching into the <object> with
        // contentDocument fails when the page is opened from file://, so this avoids it.
        // Each copy loads hidden and is swapped in on load so the logo never blanks.
        // Once the animation ends (its end frame matches the start) the file is
        // reloaded without ?play so hover can play it again.
        function replayObject(graphic) {
            const src = graphic.getAttribute("data").split(/[?#]/)[0];
            let pending = null;
            let resetTimer;

            function swapIn(url, onShown) {
                pending?.remove();
                const next = graphic.cloneNode();
                next.style.position = "absolute";
                next.style.visibility = "hidden";
                next.data = url;
                next.addEventListener("load", () => {
                    next.style.position = "";
                    next.style.visibility = "";
                    graphic.replaceWith(next);
                    graphic = next;
                    pending = null;
                    onShown?.();
                }, { once: true });
                graphic.after(next);
                pending = next;
            }

            return () => {
                clearTimeout(resetTimer);
                swapIn(`${src}?play=${Date.now()}`, () => {
                    resetTimer = setTimeout(() => swapIn(src), LOGO_ANIMATION_MS + 100);
                });
            };
        }

        function replay(buttonId, graphicId) {
            const graphic = document.getElementById(graphicId);
            const playObject = graphic instanceof HTMLObjectElement ? replayObject(graphic) : null;
            document.getElementById(buttonId).addEventListener("click", () => {
                if (playObject) {
                    playObject();
                } else if (graphic instanceof HTMLImageElement) {
                    const src = graphic.getAttribute("src").split("?")[0];
                    graphic.src = `${src}?${Date.now()}`;
                } else {
                    throw new Error(`Unable to find animated graphic: ${graphicId}`);
                }
            });
        }

        replay("replay-logo-white", "logo-white");
        replay("replay-logo-color", "logo-color");
        replay("replay-ubs", "ubs");
        replay("replay-nff", "nff");
        replay("replay-friends", "friends");
    </script>
</body>
</html>
