<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 537.41 538" aria-hidden="true" role="img" class="svg-icon svg-icon-next-five-faves img-float-start">
  <title>next five faves logo</title>
  <style>
    /* Orbit intro, plays once on load:
       1. the purple circle pops in
       2. the blue ring spins into orbit, its segments lighting up clockwise, while NEXT pops in
       3. the white 5 slams down onto the circle, which thumps from the impact
       4. FAVES pops in, so the logo reads in order: Next 5 Faves */
    .svg-icon-next-five-faves .ring {
      transform-box: view-box;
      transform-origin: 268.7px 269px;
      animation: nff-orbit 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
    }
    .svg-icon-next-five-faves .ring path { animation: nff-fade 0.3s ease-out both; }
    .svg-icon-next-five-faves .ring path:nth-child(1) { animation-delay: 0.2s; }
    .svg-icon-next-five-faves .ring path:nth-child(2) { animation-delay: 0.3s; }
    .svg-icon-next-five-faves .ring path:nth-child(3) { animation-delay: 0.4s; }
    .svg-icon-next-five-faves .ring path:nth-child(4) { animation-delay: 0.5s; }
    .svg-icon-next-five-faves .ring path:nth-child(5) { animation-delay: 0.6s; }
    .svg-icon-next-five-faves .ring path:nth-child(6) { animation-delay: 0.7s; }
    .svg-icon-next-five-faves .ring path:nth-child(7) { animation-delay: 0.8s; }
    .svg-icon-next-five-faves .ring path:nth-child(8) { animation-delay: 0.9s; }

    .svg-icon-next-five-faves .dot,
    .svg-icon-next-five-faves .five,
    .svg-icon-next-five-faves .letters path {
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }
    /* The thump runs after the pop and only while active, so the pop's end state holds */
    .svg-icon-next-five-faves .dot { animation: nff-pop 0.7s ease-out both, nff-thump 0.35s ease-out 1.72s; }
    .svg-icon-next-five-faves .five { animation: nff-slam 0.6s ease-in both; animation-delay: 1.3s; }

    .svg-icon-next-five-faves .letters path { animation: nff-letter 0.5s ease-out both; }
    /* N E X T */
    .svg-icon-next-five-faves .letters path:nth-child(1) { animation-delay: 0.7s; }
    .svg-icon-next-five-faves .letters path:nth-child(2) { animation-delay: 0.78s; }
    .svg-icon-next-five-faves .letters path:nth-child(3) { animation-delay: 0.86s; }
    .svg-icon-next-five-faves .letters path:nth-child(4) { animation-delay: 0.94s; }
    /* F A V E S */
    .svg-icon-next-five-faves .letters path:nth-child(5) { animation-delay: 1.95s; }
    .svg-icon-next-five-faves .letters path:nth-child(6) { animation-delay: 2.03s; }
    .svg-icon-next-five-faves .letters path:nth-child(7) { animation-delay: 2.11s; }
    .svg-icon-next-five-faves .letters path:nth-child(8) { animation-delay: 2.19s; }
    .svg-icon-next-five-faves .letters path:nth-child(9) { animation-delay: 2.27s; }

    @keyframes nff-orbit {
      0%   { transform: rotate(-150deg) scale(0.7); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes nff-fade {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes nff-pop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.12); }
      80%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    @keyframes nff-thump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    /* Drops from big and tilted (close to the viewer) down onto the circle, then recoils */
    @keyframes nff-slam {
      0%   { transform: scale(3.2) rotate(-18deg); opacity: 0; }
      20%  { opacity: 1; }
      70%  { transform: scale(0.86) rotate(3deg); animation-timing-function: ease-out; }
      85%  { transform: scale(1.06) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes nff-letter {
      0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(6deg); opacity: 1; }
      80%  { transform: scale(0.95) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .svg-icon-next-five-faves *,
      .svg-icon-next-five-faves .ring path,
      .svg-icon-next-five-faves .letters path { animation: none; }
    }
  </style>
