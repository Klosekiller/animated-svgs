<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 273.23 322.09" aria-hidden="true" role="img" class="svg-image">
  <title>
    Used Book Sales Logo
  </title>
  <style>
    /* Each letter drops in from above the top edge, picking up speed like it's falling,
       squashes flat when it hits its spot, recoils back up, and settles with a smaller
       bounce. Letters fall one after another, row by row, left to right. Plays once on load. */
    .svg-image g > path {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: drop 1s both;
    }

    @keyframes drop {
      0%   { transform: translateY(-340px) scale(0.96, 1.08); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
      50%  { transform: translateY(0) scale(1.14, 0.8); animation-timing-function: ease-out; }
      66%  { transform: translateY(-18px) scale(0.95, 1.06); animation-timing-function: ease-in; }
      80%  { transform: translateY(0) scale(1.05, 0.95); animation-timing-function: ease-out; }
      90%  { transform: translateY(-4px) scale(1, 1); animation-timing-function: ease-in; }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* U S E D */
    .svg-image g > path:nth-child(1)  { animation-delay: 0s; }
    .svg-image g > path:nth-child(2)  { animation-delay: 0.12s; }
    .svg-image g > path:nth-child(3)  { animation-delay: 0.24s; }
    .svg-image g > path:nth-child(4)  { animation-delay: 0.36s; }
    /* B O O K */
    .svg-image g > path:nth-child(5)  { animation-delay: 0.6s; }
    .svg-image g > path:nth-child(6)  { animation-delay: 0.72s; }
    .svg-image g > path:nth-child(7)  { animation-delay: 0.84s; }
    .svg-image g > path:nth-child(8)  { animation-delay: 0.96s; }
    /* S A L E S */
    .svg-image g > path:nth-child(9)  { animation-delay: 1.2s; }
    .svg-image g > path:nth-child(10) { animation-delay: 1.32s; }
    .svg-image g > path:nth-child(11) { animation-delay: 1.44s; }
    .svg-image g > path:nth-child(12) { animation-delay: 1.56s; }
    .svg-image g > path:nth-child(13) { animation-delay: 1.68s; }

    @media (prefers-reduced-motion: reduce) {
      .svg-image g > path { animation: none; }
    }
  </style>
